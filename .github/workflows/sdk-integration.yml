name: Stacks SDK Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 * * * *"

jobs:
  prepare-random-environment:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.prepare.outputs.should_run }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Decide and Generate Matrix
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            console.log(`🔔 Triggered by: ${eventName}`);

            // ── Decide whether to run ──────────────────────────────────────
            let shouldRun = false;

            if (eventName !== 'schedule') {
              shouldRun = true;
              console.log('✅ Non-scheduled event — will always run');
            } else {
              const CHANCE = 20;
              const roll = Math.floor(Math.random() * 100);
              shouldRun = roll < CHANCE;
              console.log(`🎲 Scheduled roll: ${roll} vs threshold ${CHANCE} → ${shouldRun ? 'RUN' : 'SKIP'}`);
            }

            core.setOutput('should_run', String(shouldRun));

            if (!shouldRun) {
              console.log('⏭️ Skipping matrix generation');
              // ✅ Safe sentinel — test-examples is guarded by should_run
              // so this matrix is never actually consumed
              core.setOutput('matrix', JSON.stringify({
                include: [{ os: 'ubuntu-latest', 'node-version': 20, project: 'none', sdks: '' }]
              }));
              return;
            }

            // ── Helpers ────────────────────────────────────────────────────
            const shuffle    = (arr) => [...arr].sort(() => Math.random() - 0.5);
            const randInt    = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const randomPick = (arr, min, max) => shuffle(arr).slice(0, randInt(min, max));

            // ── Pools ──────────────────────────────────────────────────────
            const osList      = ['ubuntu-latest', 'windows-latest', 'macos-latest'];
            const nodeList    = [18, 20, 21];
            const projectList = Array.from({ length: 13 }, (_, i) => `example${i + 1}`);
            const sdkList     = [
              'sbtc-payment-sdk',
              'stx-vault-sdk',
              'stx-defi-activity-sdk',
              'stx-portfolio-sdk',
              'stacks-pay-sdk',
              'hashlock-lending-sdk',
              '@investorphem/stx-validator-tools',
              '@investorphem/stx-utils',
              '@investorphem/validator-tools',
              '@investorphem/string-tools',
              'masomind-sdk',
              '@investorphem/hashlock-sdk'
            ];

            // ── Random counts — truly unpredictable ───────────────────────
            const selectedOS       = randomPick(osList,       1, osList.length);
            const selectedNodes    = randomPick(nodeList,     1, nodeList.length);
            const selectedProjects = randomPick(projectList,  1, 5);
            // SDKs: each project-os-node combo gets its OWN random SDK set
            // built inside the include matrix below

            // ── Build explicit include matrix ─────────────────────────────
            // Instead of relying on GitHub's matrix cross-product (which can
            // behave oddly), we build every combination explicitly so each
            // job gets its own independently randomised SDK list
            const includes = [];

            for (const os of selectedOS) {
              for (const node of selectedNodes) {
                for (const project of selectedProjects) {
                  // Each combo picks its own random SDK count and selection
                  const sdkCount    = randInt(2, sdkList.length);
                  const selectedSDKs = randomPick(sdkList, sdkCount, sdkCount);

                  includes.push({
                    os,
                    'node-version': node,
                    project,
                    // ✅ Dynamic per-job SDK string — not shared across jobs
                    sdks: selectedSDKs.join(' ')
                  });
                }
              }
            }

            // ✅ Use explicit `include` format — most reliable matrix structure
            const matrix = { include: includes };

            console.log(`\n📊 Matrix summary:`);
            console.log(`   OS       : ${selectedOS.join(', ')}`);
            console.log(`   Node     : ${selectedNodes.join(', ')}`);
            console.log(`   Projects : ${selectedProjects.join(', ')}`);
            console.log(`   Total jobs: ${includes.length}`);
            includes.forEach((combo, i) => {
              console.log(`\n   Job ${i + 1}: ${combo.os} | Node ${combo['node-version']} | ${combo.project}`);
              console.log(`   SDKs: ${combo.sdks}`);
            });

            core.setOutput('matrix', JSON.stringify(matrix));

  test-examples:
    needs: prepare-random-environment
    # ✅ Strict string check — never skips when it shouldn't
    if: needs.prepare-random-environment.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-random-environment.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install SDKs
        run: |
          cd examples/${{ matrix.project }}
          echo "📦 Installing SDKs: ${{ matrix.sdks }}"
          npm install ${{ matrix.sdks }}
          npm list --depth=0