name: Stacks SDK Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 * * * *"

jobs:
  prepare-random-environment:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.prepare.outputs.should_run }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      # ✅ Single step — no inter-step output dependency at all
      - name: Decide and Generate Matrix
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            console.log(`🔔 Triggered by: ${eventName}`);

            // ── Decide whether to run ──────────────────────────────────────
            let shouldRun = false;

            if (eventName !== 'schedule') {
              // Always run on push / pull_request
              shouldRun = true;
              console.log('✅ Non-scheduled event — will always run');
            } else {
              // 20% chance on schedule
              const CHANCE = 20;
              const roll = Math.floor(Math.random() * 100);
              shouldRun = roll < CHANCE;
              console.log(`🎲 Scheduled roll: ${roll} vs threshold ${CHANCE} → ${shouldRun ? 'RUN' : 'SKIP'}`);
            }

            core.setOutput('should_run', String(shouldRun));

            if (!shouldRun) {
              console.log('⏭️ Skipping matrix generation');
              // Set a safe empty sentinel so fromJSON never receives null
              core.setOutput('matrix', JSON.stringify({
                os: ['ubuntu-latest'],
                'node-version': [20],
                project: ['skip'],
                sdks: ['skip']
              }));
              return;
            }

            // ── Generate random matrix ─────────────────────────────────────
            const osList    = ['ubuntu-latest', 'windows-latest', 'macos-latest'];
            const nodeList  = [18, 20, 21];
            const projectList = Array.from({ length: 13 }, (_, i) => `example${i + 1}`);
            const sdkList   = [
              'sbtc-payment-sdk',
              'stx-vault-sdk',
              'stx-defi-activity-sdk',
              'stx-portfolio-sdk',
              'stacks-pay-sdk',
              'hashlock-lending-sdk',
              '@investorphem/stx-validator-tools',
              '@investorphem/stx-utils',
              '@investorphem/validator-tools',
              '@investorphem/string-tools',
              'masomind-sdk',
              '@investorphem/hashlock-sdk'
            ];

            const shuffle     = (arr) => [...arr].sort(() => Math.random() - 0.5);
            const randInt     = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const randomPick  = (arr, min, max) => shuffle(arr).slice(0, randInt(min, max));

            const osCount      = randInt(1, osList.length);
            const nodeCount    = randInt(1, nodeList.length);
            const projectCount = randInt(1, 5);
            const sdkCount     = randInt(2, sdkList.length);

            const selectedSDKs = randomPick(sdkList, sdkCount, sdkCount);

            const matrix = {
              os:            randomPick(osList,       osCount,      osCount),
              'node-version': randomPick(nodeList,    nodeCount,    nodeCount),
              project:        randomPick(projectList, projectCount, projectCount),
              sdks:           [selectedSDKs.join(' ')]
            };

            console.log(`\n📊 Matrix summary:`);
            console.log(`   OS       : ${matrix.os.join(', ')}`);
            console.log(`   Node     : ${matrix['node-version'].join(', ')}`);
            console.log(`   Projects : ${matrix.project.join(', ')}`);
            console.log(`   SDKs (${sdkCount}): ${selectedSDKs.join(', ')}`);

            core.setOutput('matrix', JSON.stringify(matrix));

  test-examples:
    needs: prepare-random-environment
    if: ${{ needs.prepare-random-environment.outputs.should_run == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-random-environment.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install SDKs
        run: |
          cd examples/${{ matrix.project }}
          npm install ${{ matrix.sdks }}
          npm list --depth=0