name: Stacks SDK Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 * * * *"

jobs:
  prepare-random-environment:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Decide whether to run
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          CHANCE=20
          ROLL=$(( RANDOM % 100 ))
          
          if [ $ROLL -lt $CHANCE ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Random Matrix
        id: generate-matrix
        if: steps.decide.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const osList = ['ubuntu-latest', 'windows-latest', 'macos-latest'];
            const nodeList = [18, 20, 21];
            const projectList = Array.from({length: 13}, (_, i) => `example${i+1}`);
            const sdkList = [
              'sbtc-payment-sdk',
              'stx-vault-sdk',
              'stx-defi-activity-sdk',
              'stx-portfolio-sdk',
              'stacks-pay-sdk',
              'hashlock-lending-sdk',
              '@investorphem/stx-validator-tools',
              '@investorphem/stx-utils',
              '@investorphem/validator-tools',
              '@investorphem/string-tools',
              'masomind-sdk',
              '@investorphem/hashlock-sdk'
            ];

            // Shuffle helper
            const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

            // Returns a random int between min and max (inclusive)
            const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

            // Picks a random slice of an array — count is itself random between min and max
            const randomPick = (arr, min, max) => shuffle(arr).slice(0, randInt(min, max));

            // OS: sometimes 1, sometimes 2, rarely all 3 — like a dev just picking whatever
            const osCount = randInt(1, 3);

            // Node: sometimes just one version, sometimes testing across two
            const nodeCount = randInt(1, 2);

            // Projects: anywhere from 1 to 5 — mimics a dev spot-checking examples
            const projectCount = randInt(1, 5);

            // SDKs: the wildcard — could be 2, could be all 12, truly unpredictable
            const sdkCount = randInt(2, sdkList.length);

            const selectedSDKs = randomPick(sdkList, sdkCount, sdkCount);

            const matrix = {
              os: randomPick(osList, osCount, osCount),
              'node-version': randomPick(nodeList, nodeCount, nodeCount),
              project: randomPick(projectList, projectCount, projectCount),
              // Single array entry: space-joined SDK string used directly in npm install
              sdks: [selectedSDKs.join(' ')]
            };

            console.log(`🎲 This run: ${osCount} OS | ${nodeCount} Node | ${projectCount} projects | ${sdkCount} SDKs`);
            console.log("📦 SDKs selected:", selectedSDKs);
            console.log("🧩 Full matrix:", JSON.stringify(matrix, null, 2));

            core.setOutput('matrix', JSON.stringify(matrix));

  test-examples:
    needs: prepare-random-environment
    if: needs.prepare-random-environment.outputs.should_run == 'true'
    strategy:
      matrix: ${{ fromJSON(needs.prepare-random-environment.outputs.matrix) }}
      # Don't cancel other matrix jobs if one fails
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install SDKs
        run: |
          cd examples/${{ matrix.project }}
          npm install ${{ matrix.sdks }}
          npm list --depth=0