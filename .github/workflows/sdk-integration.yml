name: Stacks SDK Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 * * * *"

jobs:
  prepare-random-environment:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Decide whether to run
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          CHANCE=20
          ROLL=$(( RANDOM % 100 ))
          
          if [ $ROLL -lt $CHANCE ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Random Matrix
        id: generate-matrix
        # Only bother generating the matrix if we are actually going to run
        if: steps.decide.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const osList = ['ubuntu-latest', 'windows-latest', 'macos-latest'];
            const nodeList = [18, 20, 21];
            // Creates ['example1', 'example2', ... 'example13']
            const projectList = Array.from({length: 13}, (_, i) => `example${i+1}`);
            
            // Helper to shuffle arrays
            const shuffle = (arr) => arr.sort(() => 0.5 - Math.random());
            
            // Randomize our selections! 
            // Here we pick 1 random OS, 1 random Node version, and 3 random projects.
            const matrix = {
              os: shuffle(osList).slice(0, 1),
              'node-version': shuffle(nodeList).slice(0, 1),
              project: shuffle(projectList).slice(0, 3)
            };
            
            console.log("Generated random matrix:", matrix);
            core.setOutput('matrix', matrix);

  test-examples:
    needs: prepare-random-environment
    if: needs.prepare-random-environment.outputs.should_run == 'true'
    
    # We pull the randomized matrix JSON directly from the previous job
    strategy:
      matrix: ${{ fromJSON(needs.prepare-random-environment.outputs.matrix) }}
      
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install SDKs
        run: |
          cd examples/${{ matrix.project }}
          npm install sbtc-payment-sdk stx-vault-sdk stx-defi-activity-sdk stx-portfolio-sdk stacks-pay-sdk hashlock-lending-sdk @investorphem/stx-validator-tools @investorphem/stx-utils @investorphem/validator-tools @investorphem/string-tools masomind-sdk @investorphem/hashlock-sdk
          npm list --depth=0
