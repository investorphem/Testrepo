name: Stacks SDK Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 * * * *"

jobs:
  prepare-random-environment:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      has_jobs: ${{ steps.prepare.outputs.has_jobs }}
    steps:
      - name: Decide and Generate Matrix
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            console.log(`🔔 Triggered by: ${eventName}`);

            // ── Decide whether to run ──────────────────────────────────────
            let shouldRun = false;

            if (eventName !== 'schedule') {
              shouldRun = true;
              console.log('✅ Non-scheduled event — will always run');
            } else {
              const CHANCE = 20;
              const roll = Math.floor(Math.random() * 100);
              shouldRun = roll < CHANCE;
              console.log(`🎲 Roll: ${roll} vs ${CHANCE} → ${shouldRun ? 'RUN' : 'SKIP'}`);
            }

            if (!shouldRun) {
              console.log('⏭️ Skipping — outputting empty include list');
              core.setOutput('matrix', JSON.stringify({ include: [] }));
              // ✅ has_jobs is a NUMBER not a string — avoids all string comparison quirks
              core.setOutput('has_jobs', '0');
              return;
            }

            // ── Helpers ────────────────────────────────────────────────────
            const shuffle    = (arr) => [...arr].sort(() => Math.random() - 0.5);
            const randInt    = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const randomPick = (arr, min, max) => shuffle(arr).slice(0, randInt(min, max));

            // ── Pools ──────────────────────────────────────────────────────
            const osList = ['ubuntu-latest', 'windows-latest', 'macos-latest'];
            const nodeList = [18, 20, 21];
            const projectList = Array.from({ length: 13 }, (_, i) => `example${i + 1}`);
            const sdkList = [
              'sbtc-payment-sdk',
              'stx-vault-sdk',
              'stx-defi-activity-sdk',
              'stx-portfolio-sdk',
              'stacks-pay-sdk',
              'hashlock-lending-sdk',
              '@investorphem/stx-validator-tools',
              '@investorphem/stx-utils',
              '@investorphem/validator-tools',
              '@investorphem/string-tools',
              'masomind-sdk',
              '@investorphem/hashlock-sdk'
            ];

            // ── Random selections ──────────────────────────────────────────
            const selectedOS       = randomPick(osList,      1, osList.length);
            const selectedNodes    = randomPick(nodeList,    1, nodeList.length);
            const selectedProjects = randomPick(projectList, 1, 5);

            // ── Build explicit include matrix ──────────────────────────────
            const includes = [];

            for (const os of selectedOS) {
              for (const node of selectedNodes) {
                for (const project of selectedProjects) {
                  const sdkCount     = randInt(2, sdkList.length);
                  const selectedSDKs = randomPick(sdkList, sdkCount, sdkCount);
                  includes.push({
                    os,
                    'node-version': node,
                    project,
                    sdks: selectedSDKs.join(' ')
                  });
                }
              }
            }

            console.log(`\n📊 Matrix summary:`);
            console.log(`   OS:         ${selectedOS.join(', ')}`);
            console.log(`   Node:       ${selectedNodes.join(', ')}`);
            console.log(`   Projects:   ${selectedProjects.join(', ')}`);
            console.log(`   Total jobs: ${includes.length}`);
            includes.forEach((c, i) => {
              console.log(`\n   Job ${i+1}: ${c.os} | Node ${c['node-version']} | ${c.project}`);
              console.log(`   SDKs: ${c.sdks}`);
            });

            core.setOutput('matrix', JSON.stringify({ include: includes }));
            // ✅ Output the COUNT — numeric comparison is unambiguous
            core.setOutput('has_jobs', String(includes.length));

  test-examples:
    needs: prepare-random-environment
    # ✅ Compare against '0' — numeric string comparison, no true/false casting issues
    if: needs.prepare-random-environment.outputs.has_jobs != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-random-environment.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install SDKs
        run: |
          cd examples/${{ matrix.project }}
          echo "📦 Installing: ${{ matrix.sdks }}"
          npm install ${{ matrix.sdks }}
          npm list --depth=0